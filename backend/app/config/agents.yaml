version: "1.0"
agents:
  technical_analyst:
    role: "Senior Technical Architect & Project Analyst"
    goal: "Provide comprehensive technical analysis including architecture design, technology recommendations, risk assessment, project planning, timeline estimation, and cost analysis"
    backstory: "You are a highly experienced senior technical architect with over 15 years of experience in software design, technology selection, risk assessment, and project planning. You have successfully led numerous complex software projects from conception to deployment. Your expertise spans multiple domains including web applications, mobile apps, enterprise systems, and cloud infrastructure. You are skilled at breaking down complex requirements, identifying potential risks, estimating realistic timelines and costs, and providing actionable recommendations. You always provide quantitative assessments and detailed analysis covering technical complexity, maintainability, scalability, risks, project phases, resource requirements, and comprehensive recommendations."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-opus-20240229"
      temperature: 0.2
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds
      tools:
        - document_analyzer
        - code_reviewer

  risk_analyst:
    role: "Risk Analyst"
    goal: "Identify potential risks and develop mitigation strategies"
    backstory: "You are a skilled risk analyst with a background in project management and risk assessment. Your job is to identify potential risks in the project and develop effective mitigation strategies."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-opus-20240229"
      temperature: 0.2
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds
      tools:
        - risk_analyzer
        - mitigation_generator

  project_planner:
    role: "Project Planner"
    goal: "Create a comprehensive project plan with timeline and resource requirements"
    backstory: "You are an experienced project manager with expertise in planning complex software projects. Your job is to create a comprehensive project plan with timeline, milestones, and resource requirements."
    verbose: true
    allow_delegation: true
    llm:
      provider: "anthropic"
      model: "claude-3-opus-20240229"
      temperature: 0.2
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds
      tools:
        - timeline_generator
        - resource_calculator

tasks:
  technical_analysis:
    description: "Analyze project requirements and provide comprehensive technical recommendations covering architecture, technology stack, complexity assessment, risk analysis, project planning, timeline estimation, and cost analysis"
    expected_output: |
      A comprehensive technical analysis report that includes:
      
      ## Technical Analysis
      **Architecture**: [Specific architectural pattern, e.g., "Microservices", "Monolithic", "Serverless", "Event-driven"]
      
      **Tech Stack**:
      - Frontend: [React, Vue.js, Angular, Next.js, etc.]
      - Backend: [Node.js, Python/Django, Java/Spring, .NET Core, etc.]
      - Database: [PostgreSQL, MongoDB, MySQL, Redis, etc.]
      - Infrastructure: [AWS, Azure, GCP, Docker, Kubernetes, etc.]
      - Tools: [Git, Jenkins, Docker, Terraform, etc.]
      
      **Scores**:
      - Complexity: [1-10]
      - Maintainability: [1-10]
      - Scalability: [1-10]
      
      ## Risk Assessment
      - Overall Risk Score: [1-10]
      - Key Risks:
        - [Risk Name]: [Low/Medium/High/Critical] - [Brief impact description]
        - [Risk Name]: [Low/Medium/High/Critical] - [Brief impact description]
        - [Risk Name]: [Low/Medium/High/Critical] - [Brief impact description]
      
      ## Project Plan
      **Timeline**: [X weeks/months]
      **Estimated Cost**: $[Amount]
      **Team Size**: [X developers]
      
      **Project Phases**:
      1. [Phase Name] - [Duration] - [Key deliverables]
      2. [Phase Name] - [Duration] - [Key deliverables]
      3. [Phase Name] - [Duration] - [Key deliverables]
      
      **Milestones**:
      - [Milestone Name] - [Date/Week]
      - [Milestone Name] - [Date/Week]
      - [Milestone Name] - [Date/Week]
      
      ## Recommendations
      - [Specific actionable recommendation]
      - [Specific actionable recommendation]
      - [Specific actionable recommendation]
      
      ## Explanations
      **Complexity Score Reasoning**: [Detailed explanation of why the complexity score was assigned]
      
      **Maintainability Score Reasoning**: [Detailed explanation of maintainability assessment]
      
      **Scalability Score Reasoning**: [Detailed explanation of scalability potential]
      
      **Risk Analysis Details**: [Detailed explanation of identified risks, their probability, and potential impact]
      
      **Technology Choice Rationale**: [Detailed explanation of why specific technologies were recommended]
      
      **Cost Estimation Breakdown**: [Detailed breakdown of cost factors and assumptions]
      
      Provide specific technology names, numerical scores, and structured data that can be easily parsed while including detailed explanations in the separate explanations section.
    agent: "technical_analyst"
    dependencies: []
    context_requirements:
      - project_documents
      - project_requirements

  risk_assessment:
    description: "Identify potential risks and develop mitigation strategies"
    expected_output: "Risk assessment report with identified risks and mitigation strategies"
    agent: "risk_analyst"
    dependencies: []
    context_requirements:
      - project_documents
      - project_requirements

  project_planning:
    description: "Create a comprehensive project plan with timeline and resource requirements"
    expected_output: "Project plan with timeline, milestones, and resource requirements"
    agent: "project_planner"
    dependencies:
      - technical_analysis
      - risk_assessment
    context_requirements:
      - technical_analysis_results
      - risk_assessment_results

crews:
  project_analysis_crew:
    name: "Project Analysis Crew"
    description: "Analyze project requirements and create a comprehensive project plan"
    agents:
      - technical_analyst
      - risk_analyst
      - project_planner
    tasks:
      - technical_analysis
      - risk_assessment
      - project_planning
    process: "sequential"
    verbose: true
    memory: true
    llm:
      provider: "anthropic"
      model: "${ANTHROPIC_MODEL}"
      temperature: 0.2
      anthropic_api_key: "${ANTHROPIC_API_KEY}"
    config:
      max_iterations: 5
      max_execution_time: 600  # seconds
