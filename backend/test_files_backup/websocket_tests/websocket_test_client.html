<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .connection-panel {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .message-panel {
            display: flex;
            margin-bottom: 20px;
        }
        .message-input {
            flex-grow: 1;
            padding: 10px;
            margin-right: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .log-container {
            flex-grow: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }
        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
        }
        .log-info {
            background-color: #e3f2fd;
        }
        .log-error {
            background-color: #ffebee;
        }
        .log-success {
            background-color: #e8f5e9;
        }
        .log-user {
            background-color: #fff3e0;
        }
        .log-agent {
            background-color: #f3e5f5;
        }
        .log-status {
            background-color: #ede7f6;
        }
        .project-id-input {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Test Client</h1>
        
        <div class="connection-panel">
            <h2>Connection</h2>
            <div>
                <input type="text" id="projectId" class="project-id-input" value="cafdc31f-3e2f-48fb-92de-af73da4001da" placeholder="Project ID">
                <button id="connectBtn">Connect</button>
                <button id="disconnectBtn" disabled>Disconnect</button>
            </div>
            <div id="connectionStatus">Not connected</div>
        </div>
        
        <div class="message-panel">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." disabled>
            <button id="sendBtn" disabled>Send</button>
            <button id="startAnalysisBtn" disabled>Start Analysis</button>
        </div>
        
        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        let socket = null;
        let pingInterval = null; // Interval for sending ping messages
        
        // DOM Elements
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const projectIdInput = document.getElementById('projectId');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const startAnalysisBtn = document.getElementById('startAnalysisBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const logContainer = document.getElementById('logContainer');
        
        // Connect to WebSocket
        connectBtn.addEventListener('click', () => {
            const projectId = projectIdInput.value.trim();
            if (!projectId) {
                addLogEntry('Please enter a project ID', 'error');
                return;
            }
            
            try {
                // Connect to WebSocket
                const wsUrl = `ws://localhost:8000/api/v1/ws/agent-conversation/${projectId}`;
                console.log(`Connecting to: ${wsUrl}`);
                socket = new WebSocket(wsUrl);
                addLogEntry(`Attempting to connect to: ${wsUrl}`, 'info');
                
                // WebSocket event handlers
                socket.onopen = (event) => {
                    connectionStatus.textContent = 'Connected';
                    connectionStatus.style.color = 'green';
                    
                    // Enable/disable buttons
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    startAnalysisBtn.disabled = false;
                    
                    addLogEntry('WebSocket connection established', 'success');
                    
                    // Start sending ping messages every 5 seconds to keep the connection alive
                    startPingInterval();
                };
                
                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                socket.onclose = (event) => {
                    connectionStatus.textContent = 'Disconnected';
                    connectionStatus.style.color = 'red';
                    
                    // Enable/disable buttons
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                    startAnalysisBtn.disabled = true;
                    
                    // Stop the ping interval
                    stopPingInterval();
                    
                    // Log close event details
                    console.log('WebSocket close event:', event);
                    addLogEntry(`WebSocket connection closed. Code: ${event.code}, Reason: ${event.reason || 'No reason provided'}`, 'info');
                    socket = null;
                };
                
                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    addLogEntry(`WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                    addLogEntry('Check browser console for more details', 'error');
                };
                
            } catch (error) {
                addLogEntry(`Error connecting to WebSocket: ${error.message}`, 'error');
            }
        });
        
        // Function to start sending ping messages to keep the connection alive
        function startPingInterval() {
            // Clear any existing interval
            if (pingInterval) {
                clearInterval(pingInterval);
            }
            
            // Send a ping message every 5 seconds
            pingInterval = setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    try {
                        const pingMessage = {
                            type: "ping",
                            timestamp: Date.now()
                        };
                        socket.send(JSON.stringify(pingMessage));
                        console.log("Sent ping message");
                    } catch (error) {
                        console.error("Error sending ping:", error);
                    }
                }
            }, 5000); // 5 seconds
            
            addLogEntry('Started ping interval (every 5 seconds)', 'info');
        }
        
        // Function to stop the ping interval
        function stopPingInterval() {
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
                console.log("Stopped ping interval");
            }
        }
        
        // Disconnect from WebSocket
        disconnectBtn.addEventListener('click', () => {
            if (socket) {
                // Stop the ping interval
                stopPingInterval();
                // Close the socket
                socket.close();
            }
        });
        
        // Send message
        sendBtn.addEventListener('click', () => {
            sendUserMessage();
        });
        
        // Send message on Enter key
        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendUserMessage();
            }
        });
        
        // Start analysis
        startAnalysisBtn.addEventListener('click', () => {
            if (socket) {
                const message = {
                    type: 'start_analysis'
                };
                socket.send(JSON.stringify(message));
                addLogEntry('Requested to start analysis', 'info');
            }
        });
        
        // Send user message
        function sendUserMessage() {
            const message = messageInput.value.trim();
            if (!message || !socket) return;
            
            const messageObj = {
                type: 'user_message',
                message: message,
                timestamp: new Date().toISOString()
            };
            
            socket.send(JSON.stringify(messageObj));
            addLogEntry(`You: ${message}`, 'user');
            messageInput.value = '';
        }
        
        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            const type = data.type;
            
            switch (type) {
                case 'connection_established':
                    addLogEntry(`Connection established: ${data.message}`, 'success');
                    break;
                    
                case 'user_message':
                    addLogEntry(`User: ${data.message}`, 'user');
                    break;
                    
                case 'agent_message':
                    addLogEntry(`${data.sender_name}: ${data.message}`, 'agent');
                    break;
                    
                case 'agent_thought':
                    addLogEntry(`${data.sender_name} (thought): ${data.message}`, 'agent');
                    break;
                    
                case 'analysis_status':
                    addLogEntry(`Status: ${data.status} - ${data.message}`, 'status');
                    break;
                    
                case 'analysis_result':
                    addLogEntry(`Analysis Result: ${JSON.stringify(data.result)}`, 'success');
                    break;
                    
                case 'error':
                    addLogEntry(`Error: ${data.message}`, 'error');
                    break;
                    
                case 'pong':
                    // Ignore pong messages
                    break;
                    
                default:
                    addLogEntry(`Unknown message type: ${type}`, 'info');
                    addLogEntry(`Message data: ${JSON.stringify(data)}`, 'info');
            }
        }
        
        // Add log entry
        function addLogEntry(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = message;
            
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
    </script>
</body>
</html>
