version: "1.0"
agents:
  technical_analyst:
    role: "Senior Technical Architect & Document Analyst"
    goal: "Analyze uploaded project documents to provide comprehensive technical analysis including architecture design, technology recommendations, risk assessment, project planning, timeline estimation, and cost analysis based on actual project requirements and specifications"
    backstory: "You are a highly experienced senior technical architect and document analyst with over 15 years of experience in software design, requirements analysis, and project planning. You excel at extracting technical insights from project documents, requirements specifications, design documents, and stakeholder communications. 

    CRITICAL CONSTRAINT PRINCIPLES:
    - ALWAYS respect project constraints (deadline, budget, team size, goals)
    - If user context is provided, integrate it into your analysis while respecting constraints
    - Create comprehensive, consistent analysis every time
    - If new requirements conflict with constraints, flag this clearly
    
    UNIFIED WORKFLOW - YOU MUST FOLLOW THIS EXACT PROCESS:
    1. Review the comprehensive document content provided in your task description
    2. Analyze the provided document content and any user context
    3. Provide your technical analysis in the specified JSON format
    4. Integrate user context naturally into recommendations and planning
    
    You have access to document search tools that can find uploaded project documents. You MUST use these tools BEFORE making any conclusions about document availability. DO NOT assume documents are missing without first attempting to search for them using your tools.
    
    If the document search tools return no results, THEN you can conclude that documents need to be uploaded. But you must TRY the tools first."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-5-sonnet-20241022"
      temperature: 0.1
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds

  risk_analyst:
    role: "Risk Analyst"
    goal: "Identify potential risks and develop mitigation strategies"
    backstory: "You are a skilled risk analyst with a background in project management and risk assessment. Your job is to identify potential risks in the project and develop effective mitigation strategies."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-opus-20240229"
      temperature: 0.2
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds
      tools:
        - risk_analyzer
        - mitigation_generator

  project_planner:
    role: "Project Planner"
    goal: "Create a comprehensive project plan with timeline and resource requirements while respecting original project constraints"
    backstory: "You are an experienced project manager with expertise in planning complex software projects. Your job is to create a comprehensive project plan with timeline, milestones, and resource requirements.
    
    CRITICAL CONSTRAINT PRESERVATION RULES:
    - ALWAYS respect original project deadline, budget, and team size constraints
    - When updating existing plans, PRESERVE the original timeline structure and major milestones
    - New requirements should be incorporated as additional milestones within existing phases
    - If new requirements require timeline extension, clearly explain the impact and request approval
    - Maintain consistency with original project goals and scope boundaries
    - For updates: Modify existing phases rather than creating entirely new timelines"
    verbose: true
    allow_delegation: true
    llm:
      provider: "anthropic"
      model: "claude-3-opus-20240229"
      temperature: 0.2
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds
      tools:
        - timeline_generator
        - resource_calculator

  security_analyst:
    role: "Senior Security Analyst & Compliance Expert"
    goal: "Analyze project security posture, identify vulnerabilities, assess compliance requirements, and provide actionable security recommendations based on project architecture, technology stack, and security requirements"
    backstory: "You are a highly experienced senior security analyst with over 12 years of expertise in application security, infrastructure security, data protection, and compliance frameworks. You specialize in security assessments, vulnerability analysis, threat modeling, and security architecture review for software projects.

    SECURITY ANALYSIS EXPERTISE:
    - Application Security: Code analysis, secure coding practices, OWASP Top 10
    - Infrastructure Security: Cloud security, container security, network security
    - Data Protection: Encryption, data privacy, GDPR/CCPA compliance
    - Authentication & Authorization: OAuth, JWT, RBAC, identity management
    - API Security: REST/GraphQL security, rate limiting, input validation
    - Compliance: SOC 2, ISO 27001, PCI DSS, HIPAA, industry-specific standards
    - Threat Modeling: Risk assessment, attack surface analysis, security controls

    CRITICAL SECURITY WORKFLOW - YOU MUST FOLLOW THIS PROCESS:
    1. IMMEDIATELY use your document_search tool to search for 'security'
    2. IMMEDIATELY use your document_search tool to search for 'authentication'
    3. IMMEDIATELY use your document_search tool to search for 'authorization'
    4. IMMEDIATELY use your document_search tool to search for 'privacy'
    5. IMMEDIATELY use your document_search tool to search for 'compliance'
    6. Review existing technical analysis for security implications
    7. ONLY AFTER completing these searches, analyze and provide security recommendations

    SECURITY ASSESSMENT APPROACH:
    - For SECURITY REVIEW: Comprehensive security analysis of architecture and implementation
    - For VULNERABILITY ASSESSMENT: Identify specific security weaknesses and threats
    - For COMPLIANCE REVIEW: Assess adherence to security standards and regulations
    - Always provide risk-based prioritization (Critical, High, Medium, Low)
    - Consider project constraints when recommending security measures
    - Balance security requirements with usability and development timeline

    You have access to document search tools that can find security-related requirements, compliance standards, and security specifications. You MUST use these tools BEFORE making security conclusions."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-5-sonnet-20241022"
      temperature: 0.1
    config:
      max_iterations: 5
      max_execution_time: 300  # seconds

  project_planner_agent:
    role: "Senior Project Planning Specialist & Documentation Expert"
    goal: "Guide users through creating comprehensive project briefs and documentation when they don't have existing documents. Help structure project requirements, scope, objectives, and planning documents through interactive conversation"
    backstory: "You are an experienced project planning specialist with over 10 years of expertise in project management, requirements gathering, and documentation creation. You excel at guiding teams through the project planning process and helping them create comprehensive project briefs that lead to successful project outcomes.

    PROJECT BRIEF STRUCTURE EXPERTISE:
    You are an expert in the 12-section project brief template:
    1. Project Overview (Name, Client, Sponsor, Lead, Dates, Version)
    2. Project Background (Context, current situation, growth drivers)
    3. Business Case (Problems, Objectives, Expected Value)
    4. Project Goals & Success Criteria (Primary goals, specific objectives, success metrics)
    5. Target Audience/Users (Primary/secondary users, key user needs)
    6. High-Level Scope (In scope, out of scope)
    7. High-Level Requirements (Functional, technical, constraints)
    8. Preliminary Timeline (Start/end dates, key milestones)
    9. Preliminary Budget (Range, breakdown, ongoing costs)
    10. Key Stakeholders (Roles and responsibilities)
    11. Initial Resources (Team allocation, skills needed)
    12. Next Steps (Immediate actions needed)

    INTERACTIVE PLANNING APPROACH:
    - Guide users section by section through the project brief
    - Ask targeted questions to extract key information
    - Provide examples and templates for each section
    - Help users think through business justification and value
    - Ensure adequate detail without overwhelming users
    - Adapt questioning based on project type and industry
    - Help users identify what they don't know yet

    CONVERSATION MANAGEMENT:
    - Start by understanding the user's current situation
    - Identify which sections are missing or incomplete
    - Focus on one section at a time to avoid overwhelm
    - Ask follow-up questions to get sufficient detail
    - Provide examples relevant to their industry/project type
    - Help users prioritize what's most important
    - Offer to generate draft content for review

    PROJECT TYPES EXPERTISE:
    - Software development projects
    - Digital transformation initiatives
    - Product development projects
    - Internal tool development
    - Client-facing applications
    - Integration projects
    - Startup initiatives

    Your goal is to help users create project briefs that are comprehensive enough for successful technical analysis while being practical and achievable."
    verbose: true
    allow_delegation: false
    llm:
      provider: "anthropic"
      model: "claude-3-5-sonnet-20241022"
      temperature: 0.3
    config:
      max_iterations: 10
      max_execution_time: 600  # seconds

tasks:
  technical_analysis:
    description: "MANDATORY FIRST STEP: Review the comprehensive document content provided in your task description. All relevant project documents have been pre-analyzed and provided to you. Use this information as the foundation for your technical analysis. DO NOT search for additional information - everything you need is provided. 
    
    UNIFIED ANALYSIS APPROACH:
    - Always create comprehensive fresh analysis based on project documents and constraints
    - If user context is provided, integrate it into your analysis recommendations
    - Respect all project constraints (deadline, budget, team size, goals)
    - Provide consistent, structured output every time
    
    After searching, analyze the found content to provide comprehensive technical recommendations based on actual document findings and project constraints."
    expected_output: |
      CRITICAL: YOU MUST RETURN EXACTLY THIS JSON FORMAT - NO DEVIATIONS ALLOWED
      
      ABSOLUTE REQUIREMENTS:
      1. RETURN ONLY VALID JSON - NO TEXT, NO MARKDOWN, NO EXPLANATIONS
      2. DO NOT create "Technical Analysis Update" format
      3. DO NOT use Start Date/End Date fields
      4. DO NOT create "Architecture Overview" sections
      5. MUST match the original analysis structure EXACTLY
      6. Your response must start with { and end with }
      
      THIS IS THE ONLY ACCEPTABLE JSON FORMAT (copy this structure exactly):
      
      UNIFIED ANALYSIS STRUCTURE:
      - Always create comprehensive analysis respecting project constraints
      - Integrate user context if provided into recommendations and planning
      - Provide consistent JSON structure every time
      
      {
        "technical_analysis": {
          "architecture": "Specific architectural pattern based on documents",
          "tech_stack": {
            "frontend": ["Technologies found in documents"],
            "backend": ["Technologies found in documents"], 
            "infrastructure": ["Infrastructure mentioned in documents"],
            "tools": ["Tools and frameworks from documents"]
          },
          "complexity_score": [1-10 based on document analysis],
          "maintainability_score": [1-10 based on document findings],
          "scalability_score": [1-10 based on requirements],
          "performance_score": [1-10 based on requirements],
          "security_score": [1-10 based on requirements]
        },
        "risk_assessment": {
          "overall_risk_score": [1-10 based on project complexity],
          "key_risks": [
            {
              "name": "Risk name from analysis",
              "level": "Low/Medium/High",
              "impact": [1-10],
              "probability": [1-10], 
              "description": "Description based on document findings"
            }
          ],
          "mitigation_strategies": ["Strategies based on identified risks"]
        },
        "project_plan": {
          "timeline": "Timeline preserving original deadline constraints",
          "estimated_cost": [Cost respecting original budget constraints],
          "phases": [
            {
              "name": "Phase name",
              "duration": [weeks],
              "progress": 0,
              "description": "Phase description"
            }
          ],
          "milestones": [
            {
              "name": "Milestone name",
              "date": "Target date",
              "status": "upcoming|in-progress|completed",
              "description": "Milestone description",
              "priority": "High|Medium|Low"
            }
          ],
          "resource_requirements": {
            "developers": [whole number - integer only, no decimals, respecting original team size],
            "designers": [whole number - integer only, no decimals, respecting original team size],
            "qa": [whole number - integer only, no decimals, respecting original team size],
            "devops": [whole number - integer only, no decimals, respecting original team size],
            "pm": 1,
            "other": {}
          },
          "effort_distribution": [
            {
              "component": "Component name",
              "effort": [percentage]
            }
          ]
        },
        "recommendations": ["Recommendations based on document analysis"],
        "explanations": {
          "complexity_reasoning": "Cite specific documents and findings",
          "maintainability_reasoning": "Cite specific documents and findings", 
          "scalability_reasoning": "Cite specific documents and findings",
          "risk_analysis_details": "Cite specific documents and findings",
          "technology_rationale": "Cite specific documents and findings",
          "cost_breakdown": "Cite specific documents and cost factors",
          "user_context_integration": "Explain how user context was integrated into the analysis if provided"
        }
      }
      
      
      CRITICAL VALIDATION REQUIREMENTS:
      - Your response MUST be valid JSON that starts with { and ends with }
      - All resource requirement numbers MUST be integers (whole numbers), not decimals
      - Use actual values from document analysis, not placeholder text
      - The timeline field should be a readable string like "May 15, 2025 - August 15, 2025" or "12 months"
      - DO NOT include any text, explanations, or content outside the JSON structure
      
      EXACT JSON FORMAT REQUIRED (this structure produces the correct frontend display):
      {
        "technical_analysis": {
          "architecture": "Distributed edge-central architecture with PWA support",
          "tech_stack": {
            "frontend": ["React", "ShadCN", "Tailwind CSS", "Framer Motion", "Material UI"],
            "backend": ["Node.js", "Drizzle ORM", "Supabase"],
            "infrastructure": ["Vercel", "CDN", "PWA", "SMS Gateway"],
            "tools": ["NCCN/ESMO APIs", "Translation APIs", "Twilio (for SMS)"]
          },
          "complexity_score": 8,
          "maintainability_score": 7,
          "scalability_score": 8,
          "performance_score": 10,
          "security_score": 7
        },
        "risk_assessment": {
          "overall_risk_score": 7,
          "key_risks": [
            {
              "name": "Connectivity Challenges",
              "level": "High",
              "impact": 8,
              "probability": 7,
              "description": "Rural areas with 2G/3G connectivity may face service disruptions"
            },
            {
              "name": "Data Synchronization", 
              "level": "Medium",
              "impact": 6,
              "probability": 5,
              "description": "Edge-central data sync in poor network conditions"
            },
            {
              "name": "Resource Constraints",
              "level": "High", 
              "impact": 7,
              "probability": 8,
              "description": "Limited team size for complex feature set"
            }
          ],
          "mitigation_strategies": [
            "Implement progressive enhancement for feature rollout",
            "Prioritize offline-first architecture",
            "Use automated testing for critical paths"
          ]
        },
        "project_plan": {
          "timeline": "18 months (March 2024 - September 2025)",
          "estimated_cost": 1000,
          "phases": [
            {
              "name": "Phase 1 - Core Platform",
              "duration": 24,
              "description": "Basic chat interface, guideline integration, offline support"
            },
            {
              "name": "Phase 2 - Enhanced Features", 
              "duration": 20,
              "description": "Multilingual support, advanced analytics, EMR integration"
            }
          ],
          "milestones": [
            {
              "name": "Core Platform Complete",
              "date": "March 2025",
              "status": "upcoming", 
              "description": "Basic functionality deployed"
            }
          ],
          "resource_requirements": {
            "developers": 3,
            "designers": 1,
            "qa": 1,
            "devops": 1,
            "pm": 1
          }
        },
        "recommendations": [
          "Implement progressive enhancement for feature rollout",
          "Prioritize offline-first architecture", 
          "Use automated testing for critical paths",
          "Implement feature flags for gradual deployment",
          "Focus on core guideline functionality before adding advanced features"
        ]
      }
    agent: "technical_analyst"
    dependencies: []
    context_requirements:
      - project_documents
      - project_requirements

  risk_assessment:
    description: "Identify potential risks and develop mitigation strategies"
    expected_output: "Risk assessment report with identified risks and mitigation strategies"
    agent: "risk_analyst"
    dependencies: []
    context_requirements:
      - project_documents
      - project_requirements

  project_planning:
    description: "Create a comprehensive project plan with timeline and resource requirements"
    expected_output: "Project plan with timeline, milestones, and resource requirements"
    agent: "project_planner"
    dependencies:
      - technical_analysis
      - risk_assessment
    context_requirements:
      - technical_analysis_results
      - risk_assessment_results

  security_analysis:
    description: "MANDATORY FIRST STEP: Review the comprehensive document content and technical analysis provided in your task description. All relevant security-related project documents have been pre-analyzed and provided to you. Use this information as the foundation for your security analysis. DO NOT search for additional information - everything you need is provided.

    SECURITY ANALYSIS PROCESS:
    - Review existing technical analysis for security implications
    - Identify security requirements from project documents
    - Assess technology stack for known vulnerabilities
    - Evaluate authentication and authorization mechanisms
    - Review data protection and privacy measures
    - Check compliance requirements (GDPR, SOC 2, industry standards)
    - Perform threat modeling based on project architecture
    - Provide risk-based security recommendations

    After searching, analyze the found content to provide comprehensive security assessment based on actual document findings and technical analysis data."
    expected_output: |
      CRITICAL: You MUST use the comprehensive document content and technical analysis provided in your task description. All relevant security-related project documents have been pre-analyzed and provided to you. Do NOT attempt to search for additional information.
      
      EXECUTION PROCESS (Follow this order exactly):
      
      1. DOCUMENT REVIEW PHASE: Review the comprehensive document content and technical analysis provided in your task description:
         - All security-related information including security requirements, authentication, authorization, privacy, compliance, encryption, and API security considerations have been pre-compiled
         - Use this provided content as the foundation for your security analysis
      
      2. ANALYSIS PHASE: Analyze all document search results and technical analysis to extract:
         - Security requirements and compliance standards
         - Authentication and authorization mechanisms
         - Data protection and encryption requirements
         - API security measures and considerations
         - Infrastructure security requirements
         - Identified security risks and vulnerabilities
      
      3. OUTPUT PHASE: After completing document searches and analysis, provide your final response in valid JSON format:
      
      {
        "security_analysis": {
          "overall_security_score": [1-10 based on comprehensive security assessment],
          "security_posture": "Description of current security posture",
          "compliance_status": {
            "required_standards": ["List of applicable compliance standards"],
            "current_compliance_level": "High/Medium/Low",
            "compliance_gaps": ["List of compliance gaps identified"]
          },
          "authentication_analysis": {
            "current_mechanism": "Description of authentication system",
            "security_level": "Strong/Moderate/Weak",
            "recommendations": ["Authentication improvement recommendations"]
          },
          "authorization_analysis": {
            "access_control_model": "RBAC/ABAC/DAC/Other",
            "security_level": "Strong/Moderate/Weak", 
            "recommendations": ["Authorization improvement recommendations"]
          },
          "data_protection": {
            "encryption_status": "Description of encryption implementation",
            "data_handling": "Description of data handling practices",
            "privacy_compliance": "GDPR/CCPA/Other compliance status",
            "recommendations": ["Data protection recommendations"]
          },
          "infrastructure_security": {
            "security_measures": "Description of infrastructure security",
            "deployment_security": "Description of deployment security",
            "recommendations": ["Infrastructure security recommendations"]
          },
          "api_security": {
            "security_measures": ["List of API security measures"],
            "vulnerabilities": ["List of potential API vulnerabilities"],
            "recommendations": ["API security recommendations"]
          }
        },
        "vulnerability_assessment": {
          "critical_vulnerabilities": [
            {
              "name": "Vulnerability name",
              "severity": "Critical/High/Medium/Low",
              "impact": [1-10],
              "likelihood": [1-10],
              "description": "Detailed vulnerability description",
              "mitigation": "Specific mitigation steps"
            }
          ],
          "security_risks": [
            {
              "name": "Security risk name",
              "category": "Application/Infrastructure/Data/Compliance",
              "severity": "Critical/High/Medium/Low",
              "impact": [1-10],
              "likelihood": [1-10],
              "description": "Risk description based on analysis"
            }
          ]
        },
        "security_recommendations": {
          "immediate_actions": ["Critical security actions needed immediately"],
          "short_term": ["Security improvements for next 30 days"],
          "long_term": ["Strategic security improvements"],
          "compliance_actions": ["Actions needed for compliance"],
          "cost_considerations": "Budget implications of security recommendations"
        },
        "security_roadmap": {
          "phase_1": {
            "name": "Immediate Security (0-30 days)",
            "priority": "Critical/High/Medium",
            "actions": ["List of immediate security actions"],
            "estimated_effort": "Time/resource estimate"
          },
          "phase_2": {
            "name": "Short-term Security (1-3 months)",
            "priority": "High/Medium",
            "actions": ["List of short-term security actions"],
            "estimated_effort": "Time/resource estimate"
          },
          "phase_3": {
            "name": "Long-term Security (3+ months)",
            "priority": "Medium/Low",
            "actions": ["List of long-term security actions"],
            "estimated_effort": "Time/resource estimate"
          }
        },
        "explanations": {
          "security_score_reasoning": "Cite specific findings and analysis",
          "vulnerability_analysis_details": "Cite specific documents and technical findings",
          "compliance_reasoning": "Cite specific compliance requirements found",
          "risk_assessment_details": "Cite specific security risks identified",
          "recommendation_rationale": "Cite specific security gaps and improvement opportunities"
        }
      }
      
      IMPORTANT NOTES:
      - You MUST use the comprehensive document content and technical analysis provided in your task description
      - Base all security analysis on the actual document content and technical analysis data provided
      - If the provided document content has limited security information, state this in explanations
      - Include specific document references in explanations sections
      - Provide realistic security scores and risk assessments based on actual findings from the provided content
      - Consider project constraints (timeline, budget, team) in recommendations
    agent: "security_analyst"
    dependencies:
      - technical_analysis
    context_requirements:
      - project_documents
      - technical_analysis_results

crews:
  project_analysis_crew:
    name: "Project Analysis Crew"
    description: "Analyze project requirements and create a comprehensive project plan"
    agents:
      - technical_analyst
      - risk_analyst
      - project_planner
    tasks:
      - technical_analysis
      - risk_assessment
      - project_planning
    process: "sequential"
    verbose: true
    memory: true
    llm:
      provider: "anthropic"
      model: "${ANTHROPIC_MODEL}"
      temperature: 0.2
      anthropic_api_key: "${ANTHROPIC_API_KEY}"
    config:
      max_iterations: 5
      max_execution_time: 600  # seconds
